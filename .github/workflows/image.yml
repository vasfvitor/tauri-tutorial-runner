name: image

# Publishes the pinned runner image to GHCR. The tag is the Dockerfile's
# content hash, so the tutorials workflow pulls exactly the image its checkout
# describes. Re-run via dispatch to refresh apt package state under the same
# tag when the Dockerfile itself has not changed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/image.yml]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and push
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG="df-${{ hashFiles('Dockerfile') }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          docker inspect --format='pushed {{index .RepoDigests 0}}' "$IMAGE:$TAG"
