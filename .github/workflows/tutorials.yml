name: tutorials

# The authoritative gate: every tutorial runs in the pinned container; a red
# step means the tutorial (or Tauri underneath it) broke. Scheduled so drift
# is caught without anyone pushing.
#
# TODO(blocked until tauri-docs commits these manifests): compare each fresh
# manifest against the copy committed in tauri-docs and open a PR when they
# diverge.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  packages: read

jobs:
  # a new tutorials/<id>/ dir joins the matrix by existing — no workflow edit
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tutorials: ${{ steps.list.outputs.tutorials }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          tutorials=$(cd tutorials && for d in */; do
            if [ -f "$d/tutorial.yaml" ]; then basename "$d"; fi
          done | jq -R . | jq -sc .)
          echo "discovered: $tutorials"
          echo "tutorials=$tutorials" >> "$GITHUB_OUTPUT"

  run:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tutorial: ${{ fromJSON(needs.discover.outputs.tutorials) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            target
            .tatu/cargo-target
            .tatu/cargo-home
          # unique key so every run saves (an exact hit skips the save, losing
          # whatever the tutorial compiled this time); restore picks the newest prefix match
          key: tutorials-${{ matrix.tutorial }}-${{ hashFiles('Dockerfile', 'Cargo.lock', 'bases/**/src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            tutorials-${{ matrix.tutorial }}-${{ hashFiles('Dockerfile', 'Cargo.lock', 'bases/**/src-tauri/Cargo.lock') }}-
            tutorials-${{ matrix.tutorial }}-

      # published by image.yml under the content hash of the image inputs; the
      # local build is only the first-run fallback before that tag exists
      - name: Pull runner image
        timeout-minutes: 10
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:env-${{ hashFiles('Dockerfile', 'Cargo.toml', 'Cargo.lock', 'bases/**') }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE" || docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # the image bakes a pre-fetched crates.io registry for exactly the
      # lockfiles this checkout carries — on a cold cache, start from it
      # instead of downloading the graphs again
      - name: Seed cargo registry from image (cold cache only)
        run: |
          if [ ! -d .tatu/cargo-home/registry ]; then
            mkdir -p .tatu/cargo-home
            docker run --rm -v "$PWD:/work" "$IMAGE" \
              cp -a /usr/local/cargo/registry /work/.tatu/cargo-home/
          fi

      - name: Run tutorial (authoritative)
        timeout-minutes: 45
        run: |
          docker run --rm -v "$PWD:/work" -e CARGO_HOME=/work/.tatu/cargo-home "$IMAGE" \
            cargo run --release -- run "tutorials/${{ matrix.tutorial }}"

      - name: Manifest matches expected (platform-independent fields)
        run: |
          docker run --rm -v "$PWD:/work" -e CARGO_HOME=/work/.tatu/cargo-home "$IMAGE" \
            cargo run --release -- verify "tutorials/${{ matrix.tutorial }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tutorial-manifests-${{ matrix.tutorial }}
          path: .tatu/out/**/tutorial.manifest.json
