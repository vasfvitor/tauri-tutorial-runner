name: tutorials

# The authoritative gate: every tutorial runs in the pinned container; a red
# step means the tutorial (or Tauri underneath it) broke. Scheduled so drift
# is caught without anyone pushing.
#
# TODO(blocked until tauri-docs commits these manifests): compare each fresh
# manifest against the copy committed in tauri-docs and open a PR when they
# diverge.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  packages: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tutorial: [greet-command, rsbuild]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            target
            .tatu/cargo-target
            .tatu/cargo-home
          # unique key so every run saves (an exact hit skips the save, losing
          # whatever the tutorial compiled this time); restore picks the newest prefix match
          key: tutorials-${{ matrix.tutorial }}-${{ hashFiles('Dockerfile', 'Cargo.lock', format('tutorials/{0}/base/src-tauri/Cargo.lock', matrix.tutorial)) }}-${{ github.run_id }}
          restore-keys: |
            tutorials-${{ matrix.tutorial }}-${{ hashFiles('Dockerfile', 'Cargo.lock', format('tutorials/{0}/base/src-tauri/Cargo.lock', matrix.tutorial)) }}-
            tutorials-${{ matrix.tutorial }}-

      # published by image.yml under the Dockerfile's content hash; the local
      # build is only the first-run fallback before that tag exists
      - name: Pull runner image
        timeout-minutes: 10
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:df-${{ hashFiles('Dockerfile') }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE" || docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run tutorial (authoritative)
        timeout-minutes: 45
        run: |
          docker run --rm -v "$PWD:/work" -e CARGO_HOME=/work/.tatu/cargo-home "$IMAGE" \
            cargo run --release -- run "tutorials/${{ matrix.tutorial }}"

      - name: Manifest matches expected (platform-independent fields)
        run: |
          docker run --rm -v "$PWD:/work" -e CARGO_HOME=/work/.tatu/cargo-home "$IMAGE" \
            cargo run --release -- verify "tutorials/${{ matrix.tutorial }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tutorial-manifests-${{ matrix.tutorial }}
          path: .tatu/out/**/tutorial.manifest.json
