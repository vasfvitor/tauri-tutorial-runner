name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # storage must be LF everywhere — CRLF in a vendored base poisons the
      # recorded diffs with line-ending churn
      - name: No CRLF-committed files
        run: |
          bad=$(git ls-files --eol | grep 'i/crlf' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # includes tests/golden.rs — the byte-compat gate for generated test
      # templates; it only renders strings, no tauri compilation involved
      - run: cargo test
      # committed schemas must match the code they're generated from
      - run: |
          cargo run -q -- schema --out /tmp/schemas
          diff -r schemas /tmp/schemas
