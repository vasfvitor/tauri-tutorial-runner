# tatu tutorial — schema v0
id: greet-command
title: Call a Rust command and read a file with the fs plugin
meta:
  difficulty: beginner
  time: 15min
  platforms: [windows, macos, linux]

base:
  # shared vendored create-tauri-app scaffold (vanilla-ts, pnpm), app name tatu-app.
  # Re-vendoring is an explicit reviewed operation on the pool base.
  fixture: ../../bases/vanilla-ts@4.7.3

steps:
  - id: verify-greet
    task: >
      Confirm the scaffold's `greet` command answers over IPC: invoking `greet`
      with the name "Tauri" returns the greeting string.
    assertions:
      - kind: ipc-local
        command: greet
        args: { name: "Tauri" }
        expect: { ok: "Hello, Tauri! You've been greeted from Rust!" }

  - id: add-fs-plugin
    task: >
      Add the tauri-plugin-fs dependency to the Rust backend and register the
      plugin with the app builder. The greet command must keep working.
    mutations:
      - engine: overlay
    assertions:
      - kind: ipc-local
        command: greet
        args: { name: "Tauri" }
        expect: { ok: "Hello, Tauri! You've been greeted from Rust!" }

  - id: grant-fs-permission
    task: >
      Let the frontend read files from the app's data directory using the fs
      plugin. Reading must fail before the capability is granted and succeed
      after.
    preconditions:
      # the teaching beat: show the ACL denial before granting the permission
      - kind: ipc-acl
        command: plugin:fs|read_text_file
        args: { path: "data.json", options: { baseDir: 14 } }
        expect: denied
    mutations:
      - engine: json-merge
        file: src-tauri/capabilities/default.json
        merge:
          permissions:
            - "fs:default"
            - "fs:allow-appdata-read-recursive"
    assertions:
      - kind: ipc-acl
        command: plugin:fs|read_text_file
        args: { path: "data.json", options: { baseDir: 14 } }
        setup: |
          let dir = app.path().app_data_dir().unwrap();
          std::fs::create_dir_all(&dir).unwrap();
          std::fs::write(dir.join("data.json"), "{\"hello\":\"acl\"}").unwrap();
        expect: { ok_contains: "acl" }
